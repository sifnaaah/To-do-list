<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow — Modern To-Do List</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              brand: {
               50: '#fff1f2',
               100: '#ffe4e6',
               400: '#fb7185',
               500: '#e11d48',
               600: '#be123c',
               700: '#9f1239',
              },
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-start py-6 px-4 sm:py-12 selection:bg-brand-100 selection:text-brand-700"
  >
    <!-- Main Container -->
    <main
      class="w-full max-w-xl bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 overflow-hidden transition-all duration-300"
    >
      <!-- Header Section -->
      <header
        class="bg-gradient-to-br from-brand-600 via-brand-500 to-indigo-500 px-6 py-8 sm:px-8 text-white relative overflow-hidden"
      >
        <!-- Decorative subtle circles -->
        <div
          class="absolute -top-12 -right-12 w-40 h-40 bg-white/10 rounded-full blur-2xl pointer-events-none"
        ></div>
        <div
          class="absolute -bottom-16 -left-12 w-36 h-36 bg-indigo-900/20 rounded-full blur-xl pointer-events-none"
        ></div>

        <div class="relative z-10 flex items-center justify-between">
          <div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">
              My Tasks
            </h1>
            <p
              id="current-date"
              class="text-indigo-100 text-sm mt-1 font-medium"
            >
              Stay organized, stay focused
            </p>
          </div>
          <div
            class="bg-white/15 backdrop-blur-md px-3.5 py-2 rounded-2xl border border-white/20 text-right"
          >
            <span
              id="header-progress"
              class="text-lg font-bold block leading-none"
              >0%</span
            >
            <span
              class="text-[11px] uppercase tracking-wider text-indigo-100 font-medium"
              >Done</span
            >
          </div>
        </div>
      </header>

      <!-- Input Form Section -->
      <section class="p-5 sm:p-6 border-b border-slate-100 bg-white">
        <form id="todo-form" class="flex gap-2.5 sm:gap-3" novalidate>
          <div class="relative flex-1">
            <input
              type="text"
              id="todo-input"
              placeholder="What needs to be done?"
              aria-label="New task description"
              autocomplete="off"
              class="w-full pl-4 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-slate-800 placeholder-slate-400 text-sm sm:text-base focus:outline-none focus:bg-white focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 transition-all duration-200"
            />
          </div>
          <button
            type="submit"
            id="add-btn"
            class="px-5 sm:px-6 py-3.5 bg-brand-600 hover:bg-brand-700 active:scale-[0.98] text-white font-semibold rounded-2xl shadow-md shadow-brand-500/25 flex items-center justify-center gap-2 transition-all duration-200 cursor-pointer shrink-0"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                clip-rule="evenodd"
              />
            </svg>
            <span class="hidden sm:inline">Add</span>
          </button>
        </form>
        <!-- Validation / Feedback Toast -->
        <p
          id="input-error"
          class="text-rose-500 text-xs font-medium mt-2 ml-1 hidden transition-opacity duration-200"
        >
          Please enter a task description first.
        </p>
      </section>

      <!-- Filter Tabs & Controls -->
      <section
        class="px-5 py-3.5 sm:px-6 bg-slate-50/70 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3"
      >
        <!-- Filter Pills -->
        <div
          class="flex p-1 bg-slate-200/70 rounded-xl w-full sm:w-auto justify-between sm:justify-start"
          role="tablist"
          aria-label="Filter tasks"
        >
          <button
            type="button"
            data-filter="all"
            role="tab"
            aria-selected="true"
            class="filter-btn flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-200 bg-white text-brand-600 shadow-sm cursor-pointer"
          >
            All
          </button>
          <button
            type="button"
            data-filter="active"
            role="tab"
            aria-selected="false"
            class="filter-btn flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:text-slate-900 transition-all duration-200 cursor-pointer"
          >
            Active
          </button>
          <button
            type="button"
            data-filter="completed"
            role="tab"
            aria-selected="false"
            class="filter-btn flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium text-slate-600 hover:text-slate-900 transition-all duration-200 cursor-pointer"
          >
            Completed
          </button>
        </div>

        <!-- Active Counter -->
        <span
          id="items-left"
          class="text-xs font-medium text-slate-500 hidden sm:inline"
        >
          0 items left
        </span>
      </section>

      <!-- Task List Container -->
      <section
        class="divide-y divide-slate-100 max-h-[55vh] overflow-y-auto"
        aria-live="polite"
      >
        <ul id="todo-list" class="divide-y divide-slate-100">
          <!-- Tasks will be dynamically injected here -->
        </ul>

        <!-- Empty State View -->
        <div
          id="empty-state"
          class="hidden py-14 px-6 text-center flex flex-col items-center justify-center"
        >
          <div
            class="w-16 h-16 bg-slate-100 text-slate-400 rounded-2xl flex items-center justify-center mb-4"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-8 w-8"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.75"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
              />
            </svg>
          </div>
          <h3 id="empty-title" class="text-base font-semibold text-slate-700">
            No tasks yet
          </h3>
          <p id="empty-subtitle" class="text-sm text-slate-400 mt-1 max-w-xs">
            Add your first task above to get started on your day.
          </p>
        </div>
      </section>

      <!-- Footer Bar -->
      <footer
        class="px-5 py-4 sm:px-6 bg-slate-50/90 border-t border-slate-100 flex items-center justify-between text-xs sm:text-sm text-slate-500"
      >
        <span id="mobile-items-left" class="font-medium"
          >0 tasks remaining</span
        >
        <button
          type="button"
          id="clear-completed-btn"
          class="text-slate-500 hover:text-rose-600 font-medium px-3 py-1.5 rounded-xl hover:bg-rose-50 transition-all duration-200 disabled:opacity-40 disabled:pointer-events-none cursor-pointer"
        >
          Clear Completed
        </button>
      </footer>
    </main>

    <!-- Subtle App Attribution / Storage Status -->
    <p class="mt-6 text-xs text-slate-400 flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span>
      Auto-saved locally in your browser
    </p>

    <!-- Application Logic -->
    <script>
      /**
       * TaskFlow To-Do List Application
       * Handles state management, localStorage persistence, inline editing, and filtering.
       */
      document.addEventListener("DOMContentLoaded", () => {
        // --- DOM Elements ---
        const todoForm = document.getElementById("todo-form");
        const todoInput = document.getElementById("todo-input");
        const inputError = document.getElementById("input-error");
        const todoList = document.getElementById("todo-list");
        const emptyState = document.getElementById("empty-state");
        const emptyTitle = document.getElementById("empty-title");
        const emptySubtitle = document.getElementById("empty-subtitle");
        const filterBtns = document.querySelectorAll(".filter-btn");
        const itemsLeftDesktop = document.getElementById("items-left");
        const itemsLeftMobile = document.getElementById("mobile-items-left");
        const clearCompletedBtn = document.getElementById(
          "clear-completed-btn",
        );
        const headerProgress = document.getElementById("header-progress");
        const currentDateEl = document.getElementById("current-date");

        // --- Application State ---
        const STORAGE_KEY = "taskflow_todos_v1";
        let tasks = [];
        let currentFilter = "all"; // 'all' | 'active' | 'completed'
        let editingTaskId = null;

        // --- Initialization ---
        function init() {
          setFormattedDate();
          loadTasksFromStorage();
          render();
        }

        /**
         * Displays today's formatted date in the header
         */
        function setFormattedDate() {
          try {
            const options = { weekday: "long", month: "short", day: "numeric" };
            currentDateEl.textContent = new Date().toLocaleDateString(
              "en-US",
              options,
            );
          } catch (e) {
            currentDateEl.textContent = "Stay organized, stay focused";
          }
        }

        /**
         * Loads saved tasks from browser localStorage safely
         */
        function loadTasksFromStorage() {
          try {
            const rawData = localStorage.getItem(STORAGE_KEY);
            if (rawData) {
              const parsed = JSON.parse(rawData);
              if (Array.isArray(parsed)) {
                tasks = parsed;
              }
            }
          } catch (error) {
            console.error("Failed to load tasks from localStorage:", error);
            tasks = [];
          }
        }

        /**
         * Persists current tasks array to browser localStorage
         */
        function saveTasksToStorage() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          } catch (error) {
            console.error("Failed to save tasks to localStorage:", error);
          }
        }

        /**
         * Generates a unique identifier for each task
         */
        function generateId() {
          return (
            Date.now().toString(36) + Math.random().toString(36).substring(2, 7)
          );
        }

        // --- CRUD Operations ---

        /**
         * Adds a new task to the top of the list
         */
        function addTask(text) {
          const trimmed = text.trim();
          if (!trimmed) {
            showInputError();
            return;
          }

          hideInputError();

          const newTask = {
            id: generateId(),
            text: trimmed,
            completed: false,
            createdAt: Date.now(),
          };

          tasks.unshift(newTask);
          saveTasksToStorage();

          // If currently viewing 'completed', switch to 'all' so user sees their newly added task
          if (currentFilter === "completed") {
            setFilter("all");
          } else {
            render();
          }

          todoInput.value = "";
          todoInput.focus();
        }

        /**
         * Toggles completion state of a task
         */
        function toggleTask(id) {
          tasks = tasks.map((task) =>
            task.id === id ? { ...task, completed: !task.completed } : task,
          );
          saveTasksToStorage();
          render();
        }

        /**
         * Deletes a task by ID
         */
        function deleteTask(id) {
          tasks = tasks.filter((task) => task.id !== id);
          if (editingTaskId === id) {
            editingTaskId = null;
          }
          saveTasksToStorage();
          render();
        }

        /**
         * Enters inline edit mode for a task
         */
        function startEditing(id) {
          editingTaskId = id;
          render();

          // Focus the inline edit input and place cursor at end
          const editInput = document.getElementById(`edit-input-${id}`);
          if (editInput) {
            editInput.focus();
            const len = editInput.value.length;
            editInput.setSelectionRange(len, len);
          }
        }

        /**
         * Saves the edited task text
         */
        function saveEdit(id, newText) {
          const trimmed = newText.trim();
          if (!trimmed) {
            // If cleared completely, cancel edit instead of saving blank text
            cancelEdit();
            return;
          }

          tasks = tasks.map((task) =>
            task.id === id ? { ...task, text: trimmed } : task,
          );
          editingTaskId = null;
          saveTasksToStorage();
          render();
        }

        /**
         * Cancels inline editing without saving changes
         */
        function cancelEdit() {
          editingTaskId = null;
          render();
        }

        /**
         * Removes all completed tasks
         */
        function clearCompleted() {
          tasks = tasks.filter((task) => !task.completed);
          saveTasksToStorage();
          render();
        }

        /**
         * Updates the active filter tab
         */
        function setFilter(filter) {
          currentFilter = filter;
          editingTaskId = null;

          filterBtns.forEach((btn) => {
            const isSelected = btn.dataset.filter === filter;
            btn.setAttribute("aria-selected", isSelected);
            if (isSelected) {
              btn.classList.add(
                "bg-white",
                "text-brand-600",
                "shadow-sm",
                "font-semibold",
              );
              btn.classList.remove("text-slate-600", "font-medium");
            } else {
              btn.classList.remove(
                "bg-white",
                "text-brand-600",
                "shadow-sm",
                "font-semibold",
              );
              btn.classList.add("text-slate-600", "font-medium");
            }
          });

          render();
        }

        // --- UI Helpers ---

        function showInputError() {
          inputError.classList.remove("hidden");
          todoInput.classList.add(
            "border-rose-400",
            "focus:border-rose-500",
            "focus:ring-rose-500/10",
          );
          todoInput.focus();
        }

        function hideInputError() {
          inputError.classList.add("hidden");
          todoInput.classList.remove(
            "border-rose-400",
            "focus:border-rose-500",
            "focus:ring-rose-500/10",
          );
        }

        /**
         * Escapes HTML characters to prevent XSS when rendering user input
         */
        function escapeHTML(str) {
          const div = document.createElement("div");
          div.textContent = str;
          return div.innerHTML;
        }

        /**
         * Main render function updating the task list, counters, and empty states
         */
        function render() {
          // Filter tasks based on active tab
          const filteredTasks = tasks.filter((task) => {
            if (currentFilter === "active") return !task.completed;
            if (currentFilter === "completed") return task.completed;
            return true;
          });

          // Update Counters & Progress
          const activeCount = tasks.filter((t) => !t.completed).length;
          const completedCount = tasks.length - activeCount;
          const progressPercent =
            tasks.length === 0
              ? 0
              : Math.round((completedCount / tasks.length) * 100);

          headerProgress.textContent = `${progressPercent}%`;
          itemsLeftDesktop.textContent = `${activeCount} ${activeCount === 1 ? "item" : "items"} left`;
          itemsLeftMobile.textContent = `${activeCount} ${activeCount === 1 ? "task" : "tasks"} remaining`;
          clearCompletedBtn.disabled = completedCount === 0;

          // Handle Empty State
          if (filteredTasks.length === 0) {
            todoList.innerHTML = "";
            emptyState.classList.remove("hidden");

            if (tasks.length === 0) {
              emptyTitle.textContent = "No tasks yet";
              emptySubtitle.textContent =
                "Add your first task above to get started on your day.";
            } else if (currentFilter === "active") {
              emptyTitle.textContent = "All caught up!";
              emptySubtitle.textContent =
                "You have no active tasks remaining. Great job!";
            } else if (currentFilter === "completed") {
              emptyTitle.textContent = "No completed tasks";
              emptySubtitle.textContent =
                "Check off a task to see it appear here.";
            }
            return;
          }

          // Hide Empty State & Render Task Items
          emptyState.classList.add("hidden");
          todoList.innerHTML = filteredTasks
            .map((task) => {
              const isEditing = editingTaskId === task.id;

              if (isEditing) {
                return `
                            <li class="px-5 py-3.5 sm:px-6 bg-brand-50/50 flex items-center gap-2.5 transition-colors duration-200">
                                <input 
                                    type="text" 
                                    id="edit-input-${task.id}" 
                                    value="${escapeHTML(task.text)}"
                                    aria-label="Edit task text"
                                    class="flex-1 px-3.5 py-2 bg-white border border-brand-400 rounded-xl text-sm sm:text-base text-slate-800 focus:outline-none focus:ring-4 focus:ring-brand-500/15"
                                >
                                <button 
                                    type="button" 
                                    data-action="save-edit" 
                                    data-id="${task.id}"
                                    title="Save changes"
                                    class="p-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl transition-colors cursor-pointer shrink-0"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                                    </svg>
                                </button>
                                <button 
                                    type="button" 
                                    data-action="cancel-edit"
                                    title="Cancel editing"
                                    class="p-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl transition-colors cursor-pointer shrink-0"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                                    </svg>
                                </button>
                            </li>
                        `;
              }

              return `
                        <li class="group px-5 py-3.5 sm:px-6 hover:bg-slate-50/90 flex items-center justify-between gap-3 transition-all duration-200">
                            <!-- Checkbox & Task Label -->
                            <div class="flex items-center gap-3.5 flex-1 min-w-0 cursor-pointer" data-action="toggle" data-id="${task.id}">
                                <button 
                                    type="button"
                                    role="checkbox"
                                    aria-checked="${task.completed}"
                                    aria-label="Mark task as ${task.completed ? "incomplete" : "complete"}"
                                    class="w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 transition-all duration-200 cursor-pointer ${
                                      task.completed
                                        ? "bg-emerald-500 border-emerald-500 text-white shadow-sm shadow-emerald-500/30"
                                        : "border-slate-300 group-hover:border-brand-500 bg-white"
                                    }"
                                >
                                    ${
                                      task.completed
                                        ? `
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
                                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                                        </svg>
                                    `
                                        : ""
                                    }
                                </button>
                                <span class="text-sm sm:text-base break-words select-none transition-all duration-200 ${
                                  task.completed
                                    ? "line-through text-slate-400"
                                    : "text-slate-700 font-medium"
                                }">
                                    ${escapeHTML(task.text)}
                                </span>
                            </div>

                            <!-- Action Buttons (Edit & Delete) -->
                            <div class="flex items-center gap-1 sm:opacity-0 sm:group-hover:opacity-100 focus-within:opacity-100 transition-opacity duration-200 shrink-0">
                                <button 
                                    type="button" 
                                    data-action="edit" 
                                    data-id="${task.id}"
                                    title="Edit task"
                                    aria-label="Edit task"
                                    class="p-2 text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-xl transition-colors cursor-pointer"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                    </svg>
                                </button>
                                <button 
                                    type="button" 
                                    data-action="delete" 
                                    data-id="${task.id}"
                                    title="Delete task"
                                    aria-label="Delete task"
                                    class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-colors cursor-pointer"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                </button>
                            </div>
                        </li>
                    `;
            })
            .join("");
        }

        // --- Event Listeners ---

        // Form Submit (Add Button & Enter Key)
        todoForm.addEventListener("submit", (e) => {
          e.preventDefault();
          addTask(todoInput.value);
        });

        // Hide error message as soon as user starts typing
        todoInput.addEventListener("input", () => {
          if (!inputError.classList.contains("hidden")) {
            hideInputError();
          }
        });

        // Event Delegation for Task List Interactions
        todoList.addEventListener("click", (e) => {
          const target = e.target.closest("[data-action]");
          if (!target) return;

          const action = target.dataset.action;
          const id = target.dataset.id;

          if (action === "toggle") {
            toggleTask(id);
          } else if (action === "edit") {
            startEditing(id);
          } else if (action === "delete") {
            deleteTask(id);
          } else if (action === "save-edit") {
            const editInput = document.getElementById(`edit-input-${id}`);
            if (editInput) saveEdit(id, editInput.value);
          } else if (action === "cancel-edit") {
            cancelEdit();
          }
        });

        // Keyboard support inside Inline Edit Input (Enter to save, Escape to cancel)
        todoList.addEventListener("keydown", (e) => {
          if (
            e.target.tagName === "INPUT" &&
            e.target.id.startsWith("edit-input-")
          ) {
            const id = e.target.id.replace("edit-input-", "");
            if (e.key === "Enter") {
              e.preventDefault();
              saveEdit(id, e.target.value);
            } else if (e.key === "Escape") {
              e.preventDefault();
              cancelEdit();
            }
          }
        });

        // Filter Tab Clicks
        filterBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            setFilter(btn.dataset.filter);
          });
        });

        // Clear Completed Click
        clearCompletedBtn.addEventListener("click", clearCompleted);

        // Start App
        init();
      });
    </script>
  </body>
</html>
